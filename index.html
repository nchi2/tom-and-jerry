<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>톰과 제리 프로토타입</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1d24; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font-family: "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.7;
      color: #e8ecf4; text-shadow: 0 1px 3px rgba(0,0,0,.8);
      pointer-events: none; white-space: pre;
    }
    #help {
      position: fixed; bottom: 12px; left: 12px; z-index: 10;
      font-family: "SF Mono", Menlo, monospace; font-size: 12px; line-height: 1.6;
      color: #9aa3b2; text-shadow: 0 1px 3px rgba(0,0,0,.8);
      pointer-events: none; white-space: pre;
    }
    #overlay {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(10, 10, 14, 0.55); color: #fff;
      font-family: system-ui, sans-serif; text-align: center;
    }
    #overlay h1 { font-size: 42px; margin: 0 0 10px; }
    #overlay p { font-size: 16px; color: #c8cede; margin: 0; }
    #overlay.hidden { display: none; }
    #hotbar {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      z-index: 12; display: flex; gap: 6px; pointer-events: none;
      font-family: "SF Mono", Menlo, monospace; font-size: 12px;
    }
    #hotbar .slot {
      background: rgba(16, 20, 30, 0.82); color: #aeb6c6;
      border: 1px solid #3a4054; border-radius: 6px;
      padding: 6px 10px; line-height: 1.35; text-align: center; min-width: 74px;
    }
    #hotbar .slot b { display: block; color: #7d879c; font-size: 11px; }
    #hotbar .slot.sel {
      border-color: #6ee07a; color: #eaf7ec;
      background: rgba(30, 48, 36, 0.9);
    }
    #hotbar .slot.dim { opacity: 0.55; }
    #hotbar .slot.hand { border-style: dashed; min-width: 62px; }
    #upgrade {
      position: fixed; top: 50%; right: 18px; transform: translateY(-50%);
      z-index: 18; display: none; min-width: 300px;
      background: rgba(14, 18, 28, 0.94); border: 1px solid #46506a; border-radius: 8px;
      padding: 10px 12px; color: #d6dced;
      font-family: "SF Mono", Menlo, monospace; font-size: 12.5px;
    }
    #upgrade .uhead {
      font-weight: 700; color: #8fd6ff; margin-bottom: 8px;
      border-bottom: 1px solid #333d55; padding-bottom: 6px;
    }
    #upgrade .warn { color: #ff8b5e; }
    #upgrade .urow { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    #upgrade .urow b {
      background: #2a3550; color: #cfe0ff; border-radius: 4px;
      padding: 1px 6px; font-size: 11px;
    }
    #upgrade .urow .lv { color: #7d879c; }
    #upgrade .urow .cost { margin-left: auto; color: #8fd6ff; }
    #upgrade .urow .eff { color: #6ee07a; min-width: 56px; text-align: right; }
    #upgrade .urow.dim { opacity: 0.45; }
    #selbox {
      position: fixed; z-index: 14; display: none; pointer-events: none;
      border: 1px solid #6ee07a; background: rgba(110, 224, 122, 0.14);
      border-radius: 2px;
    }
    #menu {
      position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center;
      background: rgba(8, 10, 16, 0.72);
      font-family: system-ui, sans-serif;
    }
    #menu.on { display: flex; }
    #menu .box {
      background: rgba(18, 22, 32, 0.97); border: 1px solid #46506a; border-radius: 10px;
      padding: 18px 20px; min-width: 260px; color: #e8ecf4; text-align: center;
    }
    #menu h2 { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
    #menu button {
      display: block; width: 100%; margin: 6px 0; padding: 10px 14px;
      background: #2a3550; color: #dfe7f7; border: 1px solid #46506a; border-radius: 6px;
      font-size: 15px; cursor: pointer; font-family: inherit;
    }
    #menu button:hover { background: #37456b; border-color: #6ee07a; }
    #menu .maps { display: none; margin-top: 10px; border-top: 1px solid #333d55; padding-top: 10px; }
    #menu .maps.on { display: block; }
    #menu .hint { color: #8b94a8; font-size: 12px; margin-top: 10px; }
    #flash {
      position: fixed; top: 22%; left: 0; right: 0; z-index: 15;
      text-align: center; pointer-events: none;
      font-family: system-ui, sans-serif; font-size: 30px; font-weight: 700;
      color: #ff6b6b; text-shadow: 0 2px 10px rgba(0,0,0,.9);
      opacity: 0; transition: opacity .35s;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="help"></div>
  <div id="flash"></div>
  <div id="selbox"></div>
  <div id="hotbar"></div>
  <div id="upgrade"></div>
  <div id="menu"><div class="box">
    <h2>일시정지</h2>
    <button id="m-resume">계속하기</button>
    <button id="m-restart">다시 시작</button>
    <button id="m-maps">맵 선택</button>
    <button id="m-quit">종료</button>
    <div class="maps" id="m-maplist"></div>
    <div class="hint">ESC로 닫기</div>
  </div></div>
  <div id="overlay" class="hidden">
    <h1>잡혔다!</h1>
    <p id="overlay-sub">R 키로 다시 시작</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

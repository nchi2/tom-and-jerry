<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>톰과 제리 프로토타입</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1d24; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font-family: "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.7;
      color: #e8ecf4; text-shadow: 0 1px 3px rgba(0,0,0,.8);
      pointer-events: none; white-space: pre;
    }
    #help {
      position: fixed; bottom: 12px; left: 12px; z-index: 10; max-width: 46vw;
      font-family: "SF Mono", Menlo, monospace; font-size: 12px; line-height: 1.65;
      color: #9aa3b2; text-shadow: 0 1px 3px rgba(0,0,0,.8);
      pointer-events: none; white-space: pre-wrap;
    }
    /* 도움말을 펼쳤을 때만 판을 깔아 글자가 배경에 묻히지 않게 */
    #help.open {
      background: rgba(12, 15, 23, 0.88); border: 1px solid #333d55; border-radius: 8px;
      padding: 10px 12px; color: #c3cbdb; max-width: 60vw;
    }
    /* 자원 — 우측 상단. 아이콘 + 수치만 (D88).
       튜닝 패널이 열려 있으면 그만큼 왼쪽으로 비켜선다 — 치즈가 가려지면 안 된다 (D91) */
    #res {
      position: fixed; top: 12px; right: 12px; z-index: 12;
      transition: right .15s ease;
      display: flex; gap: 8px; pointer-events: none;
      font-family: "SF Mono", Menlo, monospace; font-size: 15px; font-weight: 700;
    }
    #res .r {
      background: rgba(16, 20, 30, 0.86); border: 1px solid #3a4054; border-radius: 8px;
      padding: 5px 11px; color: #e8ecf4; display: flex; align-items: center; gap: 6px;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }
    #res .r .ic { font-size: 17px; }
    #res .cheese { border-color: #6b5a24; }
    #res .parts { border-color: #2f5570; }
    /* 영토 (D107 → D118) — 넓이만이 아니라 **뭘 해 주는지**까지 */
    #res .terr { border-color: #3d6b47; font-size: 11px; gap: 4px; }
    #res .rate { color: #8fe0a0; margin-left: 4px; font-weight: 700; }
    #res .terr .stam { color: #8fd6ff; font-weight: 700; }
    #res .terr .here {
      color: #0d1117; background: #8fe0a0; border-radius: 4px;
      padding: 0 5px; font-weight: 700;
    }
    /* 내 땅 안에 서 있으면 테두리가 살아난다 — 지금 혜택을 받는 중이라는 표시 */
    #res .terr.inside { border-color: #8fe0a0; background: rgba(24, 48, 32, .9); }
    body.gui-on #res, body.gui-on #net { right: 268px; }
    body.hud-off #hud { display: none; }
    /* 시작 화면 (D93) — 몇 명이 할지부터 고르고 들어간다.
       예전에는 페이지를 열면 곧장 솔로가 굴러가서, 멀티로 넘어가는 게
       "이미 돌아가는 판 위에 접속을 얹는" 모양이 됐다. */
    #start {
      position: fixed; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 35%, #232a3d 0%, #12151d 70%);
      font-family: system-ui, sans-serif; color: #e8ecf4;
    }
    #start.hidden { display: none; }
    #start .panel { width: 380px; max-width: 88vw; text-align: center; }
    #start h1 { font-size: 34px; margin: 0 0 4px; letter-spacing: -0.5px; }
    #start .sub { color: #8b94a8; font-size: 13px; margin-bottom: 22px; }
    #start button {
      display: block; width: 100%; margin: 8px 0; padding: 14px 16px;
      background: #2a3350; color: #e8ecf4; border: 1px solid #3f4a6b; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer; text-align: left;
      font-family: inherit; transition: background .12s, border-color .12s;
    }
    #start button:hover:not(:disabled) { background: #37456b; border-color: #6ee07a; }
    #start button .k { color: #8b94a8; font-size: 12px; font-weight: 400; display: block; margin-top: 3px; }
    #start button:disabled { opacity: .45; cursor: default; }
    #start .back {
      background: none; border: none; color: #8b94a8; font-size: 13px;
      width: auto; margin: 14px auto 0; padding: 6px; text-align: center;
    }
    #start input {
      width: 100%; box-sizing: border-box; margin: 8px 0; padding: 13px 14px;
      background: #171c28; color: #e8ecf4; border: 1px solid #3f4a6b; border-radius: 10px;
      font-family: "SF Mono", Menlo, monospace; font-size: 20px; letter-spacing: 5px;
      text-transform: uppercase; text-align: center;
    }
    #start .code {
      font-family: "SF Mono", Menlo, monospace; font-size: 34px; font-weight: 700;
      letter-spacing: 8px; color: #6ee07a; padding: 14px 0 6px;
    }
    #start .msg { color: #8fd6ff; font-size: 13px; min-height: 18px; margin-top: 10px; }
    #start .msg.bad { color: #ff8b8b; }
    #start .step { display: none; }
    #start .step.on { display: block; }
    /* 로비 좌석 — 누가 들어왔는지가 보여야 기다릴 수 있다 (D97) */
    #start .seats { display: flex; gap: 8px; justify-content: center; margin: 14px 0 4px; }
    #start .seat {
      width: 62px; padding: 9px 0; border-radius: 9px; font-size: 12px;
      border: 1px solid #3f4a6b; background: #171c28; color: #6b7488;
    }
    #start .seat.on { color: #12151d; font-weight: 700; border-color: transparent; }
    #start .seat .who { display: block; font-size: 11px; opacity: .75; margin-top: 2px; }
    /* 미니맵 (D95) — 우측 하단. 상대가 어디 있는지 아는 게 협동의 전제다 */
    #mini {
      /* 핫바 위로 올린다 (D118) — 200px로 키우면서 하단 우측이 핫바와 겹쳤다.
         핫바 윗변이 화면 밑에서 ~176px이라 그 위로 뺀다 */
      position: fixed; right: 12px; bottom: 190px; z-index: 12;
      border: 2px solid #4d566e; border-radius: 8px;
      background: rgba(12, 15, 23, 0.82); display: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.45);
    }
    #mini.on { display: block; }
    /* 개발 HUD를 꺼도 미니맵은 남는다 (D118) — 게임 UI지 디버그가 아니다 */
    /* 아주 좁은 화면에서만 핫바(하단 중앙)와 겹친다 — 그때는 그 위로 올린다.
       1280 기준으로 핫바는 320~960px, 미니맵은 1098px에서 시작해 안 겹친다. */
    @media (max-width: 980px) { #mini { bottom: 250px; } }
    #overlay {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(10, 10, 14, 0.55); color: #fff;
      font-family: system-ui, sans-serif; text-align: center;
    }
    #overlay h1 { font-size: 42px; margin: 0 0 10px; }
    #overlay p { font-size: 16px; color: #c8cede; margin: 0; }
    #overlay.hidden { display: none; }
    /* 무한 모드 계속하기 (D124). 오버레이 전체는 클릭을 안 받지만 이 버튼은 받아야 한다 */
    #overlay-cont {
      margin-top: 18px; padding: 12px 22px; border: 0; border-radius: 8px;
      background: linear-gradient(90deg, #c0392b, #e8743a); color: #fff;
      font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }
    #overlay-cont:hover { filter: brightness(1.12); }
    #overlay-cont.hidden { display: none; }
    #hotbar {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      z-index: 12; display: flex; gap: 6px; pointer-events: none;
      font-family: "SF Mono", Menlo, monospace; font-size: 12px;
    }
    #hotbar .slot {
      background: rgba(16, 20, 30, 0.82); color: #aeb6c6;
      border: 1px solid #3a4054; border-radius: 6px;
      padding: 6px 10px; line-height: 1.35; text-align: center; min-width: 74px;
    }
    #hotbar .slot b { display: block; color: #7d879c; font-size: 11px; }
    #hotbar .slot.sel {
      border-color: #6ee07a; color: #eaf7ec;
      background: rgba(30, 48, 36, 0.9);
    }
    #hotbar .slot.dim { opacity: 0.55; }
    #hotbar .slot.hand { border-style: dashed; min-width: 62px; }
    /* 기술이 안 열려서 아직 못 쓰는 슬롯 (D88) */
    #hotbar .slot.locked {
      opacity: 0.5; border-color: #4a3550; color: #8d7f96;
      background: rgba(24, 18, 28, 0.82);
    }
    #hotbar .slot.locked .why { color: #d08fb0; }
    /* 슬롯이 뭘 하는 물건인지 (D111) — 이름만으로는 안 읽힌다 */
    #hotbar .slot .role { color: #8b93a5; font-size: 10px; }
    #hotbar .slot.sel .role { color: #cfd6e4; }
    #hotbar .slot.rm.sel { border-color: #ffb347; background: rgba(52, 38, 20, 0.9); color: #ffe0b0; }
    #upgrade {
      position: fixed; top: 50%; right: 18px; transform: translateY(-50%);
      z-index: 18; display: none; min-width: 300px;
      background: rgba(14, 18, 28, 0.94); border: 1px solid #46506a; border-radius: 8px;
      padding: 10px 12px; color: #d6dced;
      font-family: "SF Mono", Menlo, monospace; font-size: 12.5px;
    }
    #upgrade .uhead {
      font-weight: 700; color: #8fd6ff; margin-bottom: 8px;
      border-bottom: 1px solid #333d55; padding-bottom: 6px;
    }
    #upgrade .warn { color: #ff8b5e; }
    #upgrade .urow { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    #upgrade .urow b {
      background: #2a3550; color: #cfe0ff; border-radius: 4px;
      padding: 1px 6px; font-size: 11px;
    }
    #upgrade .urow .lv { color: #7d879c; }
    #upgrade .urow .cost { margin-left: auto; color: #8fd6ff; }
    #upgrade .urow .eff { color: #6ee07a; min-width: 56px; text-align: right; }
    #upgrade .urow.dim { opacity: 0.45; }
    #selbox {
      position: fixed; z-index: 14; display: none; pointer-events: none;
      border: 1px solid #6ee07a; background: rgba(110, 224, 122, 0.14);
      border-radius: 2px;
    }
    #menu {
      position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center;
      background: rgba(8, 10, 16, 0.72);
      font-family: system-ui, sans-serif;
    }
    #menu.on { display: flex; }
    #menu .box {
      background: rgba(18, 22, 32, 0.97); border: 1px solid #46506a; border-radius: 10px;
      padding: 18px 20px; min-width: 260px; color: #e8ecf4; text-align: center;
    }
    #menu h2 { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
    #menu button {
      display: block; width: 100%; margin: 6px 0; padding: 10px 14px;
      background: #2a3550; color: #dfe7f7; border: 1px solid #46506a; border-radius: 6px;
      font-size: 15px; cursor: pointer; font-family: inherit;
    }
    #menu button:hover { background: #37456b; border-color: #6ee07a; }
    #menu .maps { display: none; margin-top: 10px; border-top: 1px solid #333d55; padding-top: 10px; }
    #menu .maps.on { display: block; }
    #menu .hint { color: #8b94a8; font-size: 12px; margin-top: 10px; }
    /* 멀티 (D92-5단계) — 방 코드 하나로 붙는다 */
    #menu .net { margin-top: 10px; border-top: 1px solid #333d55; padding-top: 10px; }
    #menu .net input {
      width: 100%; box-sizing: border-box; margin: 6px 0; padding: 8px 10px;
      background: #171c28; color: #e8ecf4; border: 1px solid #3a4054; border-radius: 6px;
      font-family: "SF Mono", Menlo, monospace; font-size: 15px; letter-spacing: 2px;
      text-transform: uppercase; text-align: center;
    }
    #menu .netmsg { color: #8fd6ff; font-size: 12px; margin-top: 6px; min-height: 16px; }
    #menu .code {
      font-family: "SF Mono", Menlo, monospace; font-size: 26px; font-weight: 700;
      letter-spacing: 6px; color: #6ee07a; text-align: center; padding: 6px 0;
    }
    /* 접속 상태 — 화면 우상단, 자원 줄 바로 아래 */
    #net {
      position: fixed; top: 46px; right: 12px; z-index: 12;
      transition: right .15s ease;
      font-family: "SF Mono", Menlo, monospace; font-size: 12px;
      background: rgba(16, 20, 30, 0.86); border: 1px solid #3a4054; border-radius: 8px;
      padding: 4px 10px; color: #9aa3b2; pointer-events: none; display: none;
    }
    #net.on { display: block; }
    /* 접속 개발 패널 (D93, F9) — "렉이 심하다"를 숫자로 바꾼다 */
    #netdev {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 14;
      background: rgba(10, 13, 20, 0.92); border: 1px solid #3a4054; border-radius: 8px;
      padding: 8px 12px; color: #c3cbdb; pointer-events: none; display: none;
      font-family: "SF Mono", Menlo, monospace; font-size: 11px; line-height: 1.55;
      white-space: pre; min-width: 300px;
    }
    #netdev.on { display: block; }
    #netdev b { color: #8fd6ff; }
    #netdev .warn { color: #ffb347; }
    #netdev .bad { color: #ff6b6b; }
    #net b { color: #6ee07a; letter-spacing: 2px; }
    #flash {
      position: fixed; top: 22%; left: 0; right: 0; z-index: 15;
      text-align: center; pointer-events: none;
      font-family: system-ui, sans-serif; font-size: 30px; font-weight: 700;
      color: #ff6b6b; text-shadow: 0 2px 10px rgba(0,0,0,.9);
      opacity: 0; transition: opacity .35s;
    }
    /* 톰 체력바 (D107) — 화면 상단 가운데. 등장했을 때만 보인다 */
    #bossbar {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      width: min(560px, 70vw); display: none; z-index: 6; pointer-events: none;
      font: 12px/1.5 ui-monospace, Menlo, monospace;
    }
    #bossbar .row { margin-bottom: 6px; }
    #bossbar .lbl {
      display: flex; justify-content: space-between; color: #ffd9d9;
      text-shadow: 0 1px 3px #000; margin-bottom: 2px; letter-spacing: .04em;
    }
    #bossbar .track {
      height: 12px; background: #2a0f14; border: 1px solid #6d2b33;
      border-radius: 3px; overflow: hidden;
    }
    #bossbar .fill {
      height: 100%; background: linear-gradient(90deg, #ff3b3b, #ff8b5e);
      transition: width .15s linear;
    }
    /* 튜토리얼 (D111) — 왼쪽 세로 목록. 지금 할 것 하나만 밝게 */
    #tut {
      position: fixed; left: 12px; top: 168px; width: 300px; display: none; z-index: 6;
      font: 12px/1.5 ui-monospace, Menlo, monospace; pointer-events: none;
      background: rgba(16,20,30,.86); border: 1px solid #3a4054; border-radius: 8px;
      padding: 9px 11px; text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }
    #tut .tstep { display: flex; align-items: baseline; gap: 7px; padding: 1px 0; }
    #tut .tstep b {
      display: inline-block; width: 15px; text-align: center; flex: none;
      color: #6b7385;
    }
    #tut .tstep .tt { flex: 1; }
    #tut .tstep .tn { color: #8fd6ff; font-size: 11px; }
    #tut .todo { color: #5c6373; }
    #tut .done { color: #6ee07a; }
    #tut .done b { color: #6ee07a; }
    #tut .now { color: #ffd24a; font-weight: 700; }
    #tut .now b { color: #ffd24a; }
    #tut .thint {
      color: #cfd6e4; font-size: 11px; margin: 3px 0 5px 22px;
      padding-left: 8px; border-left: 2px solid #ffd24a;
    }
    /* 맵 에디터 (D112) */
    /* 공격 개조 — 치즈 창고 옆에서 뜬다 (D129). 클릭으로 산다 */
    #atkup {
      position: fixed; right: 12px; bottom: 190px; z-index: 13; display: none;
      background: rgba(14, 16, 22, 0.9); border: 1px solid #2b3242; border-radius: 8px;
      padding: 9px 11px; min-width: 268px;
      font-family: "SF Mono", Menlo, monospace; font-size: 12px; color: #c8cede;
    }
    #atkup .ahead { color: #ffd24a; font-weight: 700; margin-bottom: 6px; }
    #atkup .arow {
      display: flex; align-items: baseline; gap: 7px; padding: 5px 6px; border-radius: 5px;
      cursor: pointer; border: 1px solid transparent;
    }
    #atkup .arow:hover { background: #1d2432; border-color: #3d4a63; }
    #atkup .arow.dim { opacity: 0.45; cursor: default; }
    #atkup .arow.dim:hover { background: none; border-color: transparent; }
    #atkup .arow .lv { color: #8fd6ff; }
    #atkup .arow .eff { color: #8b93a5; margin-left: auto; font-size: 11px; }
    #atkup .ahint { color: #6b7385; font-size: 11px; margin-top: 5px; }
    /* 클릭으로 사는 개조 줄 (D129) */
    #upgrade .urow { cursor: pointer; border: 1px solid transparent; border-radius: 5px; padding: 2px 5px; }
    #upgrade .urow:hover { background: #1d2432; border-color: #3d4a63; }
    #upgrade .urow.dim { cursor: default; }
    #upgrade .urow.dim:hover { background: none; border-color: transparent; }
    #editor {
      position: fixed; left: 12px; top: 120px; width: 268px; display: none; z-index: 7;
      font: 12px/1.6 ui-monospace, Menlo, monospace; color: #e8ecf4;
      background: rgba(16,20,30,.92); border: 1px solid #3a4054; border-radius: 8px;
      padding: 10px 12px; text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }
    #editor .ehead { color: #ffd24a; font-weight: 700; margin-bottom: 7px; line-height: 1.4; }
    #editor .ebrush { display: flex; gap: 8px; color: #8b93a5; padding: 1px 0; }
    #editor .ebrush b { width: 15px; text-align: center; color: #6b7385; }
    #editor .ebrush.sel { color: #ffd24a; font-weight: 700; }
    #editor .ebrush.sel b { color: #ffd24a; }
    #editor .ehint {
      color: #cfd6e4; font-size: 11px; margin: 7px 0 5px;
      padding-left: 8px; border-left: 2px solid #ffd24a;
    }
    #editor .ecount { color: #8fd6ff; font-size: 11px; }
    #editor .ekeys { color: #6b7385; font-size: 11px; margin-top: 5px; }

    /* 단계 안내 — 화면 가운데 크게 (D113) */
    #tutbig {
      position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%);
      width: min(760px, 88vw); text-align: center; z-index: 8; pointer-events: none;
      opacity: 0; transition: opacity .35s ease;
    }
    #tutbig.on { opacity: 1; }
    #tutbig .tb-step {
      color: #ffd24a; font: 700 13px/1.4 ui-monospace, Menlo, monospace;
      letter-spacing: .22em; margin-bottom: 6px;
    }
    #tutbig .tb-title {
      color: #fff; font: 700 34px/1.25 system-ui, -apple-system, "Noto Sans KR", sans-serif;
      text-shadow: 0 3px 18px rgba(0,0,0,.95), 0 1px 3px rgba(0,0,0,1);
    }
    #tutbig .tb-hint {
      color: #cfd6e4; font: 15px/1.5 system-ui, -apple-system, "Noto Sans KR", sans-serif;
      margin-top: 10px; text-shadow: 0 2px 10px rgba(0,0,0,.95);
    }
    /* 채팅 (D120) — 왼쪽 아래. 평소엔 기록만, T를 누르면 입력줄이 열린다 */
    #chat {
      position: fixed; left: 12px; bottom: 96px; width: min(420px, 40vw); z-index: 13;
      font: 12px/1.5 ui-monospace, Menlo, monospace; pointer-events: none;
    }
    #chatlog { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
    #chatlog .cline {
      background: rgba(12,15,23,.72); border-radius: 5px; padding: 2px 7px;
      align-self: flex-start; max-width: 100%; text-shadow: 0 1px 3px rgba(0,0,0,.9);
      color: #e8ecf4;
    }
    #chatlog .cline .who { font-weight: 700; margin-right: 5px; }
    #chatbar {
      display: none; margin-top: 5px; align-items: center; gap: 7px;
      background: rgba(12,15,23,.94); border: 1px solid #ffd24a; border-radius: 6px;
      padding: 5px 8px; pointer-events: auto;
    }
    #chatbar.on { display: flex; }
    #chatbar .cprompt { color: #ffd24a; font-weight: 700; flex: none; }
    #chatbar input {
      flex: 1; background: transparent; border: 0; outline: 0; color: #fff;
      font: 13px ui-monospace, Menlo, monospace; min-width: 0;
    }
    #chatbar .cquick { color: #6b7385; font-size: 10px; flex: none; }
    /* 설정 — 소리 크기 (D123) */
    #menu .vol {
      display: flex; align-items: center; gap: 10px; margin: 8px 0 2px;
      color: #cfd6e4; font: 13px ui-monospace, Menlo, monospace;
    }
    #menu .vol label { flex: none; }
    #menu .vol b { color: #ffd24a; }
    #menu .vol input { flex: 1; accent-color: #ffd24a; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="net"></div>
  <div id="netdev"></div>
  <canvas id="mini" width="200" height="200"></canvas>
  <div id="res"></div>
  <div id="help"></div>
  <!-- 톰 체력바 (D107) — 둘이 오므로 여러 줄이 될 수 있다 -->
  <div id="bossbar"></div>
  <!-- 튜토리얼 단계 목록 (D111) — 좌측, 진행 중일 때만 -->
  <div id="tut"></div>
  <!-- 단계가 바뀔 때 화면 가운데 크게 (D113) — 옆 목록만으로는 안 읽힌다 -->
  <div id="tutbig"><div class="tb-step"></div><div class="tb-title"></div><div class="tb-hint"></div></div>
  <!-- 맵 에디터 (D112) -->
  <div id="editor"></div>
  <!-- 채팅 (D120) — 좌하단 기록 + 열었을 때만 입력줄 -->
  <div id="chat"><div id="chatlog"></div><div id="chatbar"><span class="cprompt">말하기</span><input id="chatin" maxlength="90" autocomplete="off" /><span class="cquick">1~4 빠른말 · Enter 보내기 · Esc 취소</span></div></div>
  <div id="flash"></div>
  <div id="selbox"></div>
  <div id="hotbar"></div>
  <div id="upgrade"></div>
  <div id="atkup"></div>
  <div id="menu"><div class="box">
    <h2>일시정지</h2>
    <button id="m-resume">계속하기</button>
    <button id="m-restart">다시 시작</button>
    <button id="m-help">조작법 (H)</button>
    <button id="m-gui">튜닝 패널 켜기/끄기 (G)</button>
    <button id="m-maps">맵 선택</button>
    <button id="m-quit">종료</button>
    <div class="maps" id="m-maplist"></div>
    <!-- 소리 크기 (D123) — 튜닝 패널이 아니라 여기 있어야 실제로 쓴다 -->
    <div class="vol">
      <label for="m-vol">효과음 <b id="m-volnum">48%</b></label>
      <input id="m-vol" type="range" min="0" max="100" step="1" value="48" />
    </div>
    <div class="net">
      <button id="m-invite">2인 협동 — 방 만들기 / 참가</button>
      <button id="m-leave">멀티 끊기 (혼자 하기)</button>
      <div class="netmsg" id="m-netmsg"></div>
    </div>
    <div class="hint">ESC로 닫기</div>
  </div></div>
  <div id="start">
    <div class="panel">
      <h1>톰과 제리</h1>
      <div class="sub">작은 햄스터, 큰 고양이. 틈이 좁으면 못 지나간다</div>

      <div class="step on" id="s-mode">
        <button id="s-tut">연습 (처음이라면 여기)<span class="k">치즈를 벽으로 감싸는 것부터 병사 고용까지 8단계</span></button>
        <button id="s-solo">1인 플레이<span class="k">진짜 혼자다. 잡히면 5분 안에 내 땅으로 돌아와야 지은 게 산다</span></button>
        <button id="s-two">2인 협동<span class="k">붙는 순간 시작. 적 1.8배. 잡혀도 구해 주면 기지가 산다</span></button>
        <button id="s-four">3~4인 협동<span class="k">최대 넷. 다 모이면 방장이 시작한다 — 적은 인원수만큼 는다</span></button>
        <button id="s-editor">맵 에디터<span class="k">바위·늪·덤불·치즈를 직접 놓아 지도를 만든다</span></button>
      </div>

      <div class="step" id="s-two-menu">
        <button id="s-create">방 만들기<span class="k">코드가 나오면 친구에게 불러 주세요</span></button>
        <button id="s-joinform">방 코드로 참가<span class="k">친구가 부른 여섯 글자를 입력</span></button>
        <button class="back" id="s-back1">← 뒤로</button>
      </div>

      <div class="step" id="s-size">
        <div class="sub">몇 명이 할까요?</div>
        <button id="s-size3">3인 방<span class="k">적 2.6배</span></button>
        <button id="s-size4">4인 방<span class="k">적 3.4배</span></button>
        <button class="back" id="s-back4">← 뒤로</button>
      </div>

      <div class="step" id="s-hosting">
        <div class="sub">친구에게 이 코드를 불러 주세요</div>
        <div class="code" id="s-code">······</div>
        <div class="msg" id="s-hostmsg">방 여는 중…</div>
        <div class="seats" id="s-seats"></div>
        <button id="s-begin" style="display:none">시작하기</button>
        <button class="back" id="s-back2">← 취소</button>
      </div>

      <div class="step" id="s-lobby">
        <div class="sub">방 <b id="s-lobby-code"></b> — 방장이 시작하기를 기다리는 중</div>
        <div class="seats" id="s-seats2"></div>
        <div class="msg" id="s-lobbymsg"></div>
        <button class="back" id="s-back5">← 나가기</button>
      </div>

      <div class="step" id="s-joining">
        <div class="sub">친구가 불러 준 코드</div>
        <input id="s-code-in" maxlength="6" placeholder="ABC123" autocomplete="off" />
        <button id="s-connect">접속</button>
        <div class="msg" id="s-joinmsg"></div>
        <button class="back" id="s-back3">← 뒤로</button>
      </div>
    </div>
  </div>
  <div id="overlay" class="hidden">
    <h1>잡혔다!</h1>
    <p id="overlay-sub">ESC → 다시 시작</p>
    <button id="overlay-cont" class="hidden">계속하기 [Enter]</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
